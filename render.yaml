# Render Blueprint — https://render.com/docs/blueprint-spec
#
# 3 services: a managed Postgres database, the FastAPI backend, and a
# static frontend site. Deploy with "New +" -> "Blueprint" on Render,
# pointing at this repo.
#
# The frontend is currently a placeholder (see frontend/README.md) --
# once the real frontend build lands (OpenCode), update buildCommand /
# staticPublishPath / rootDir below to match it.

databases:
  - name: dream-advisor-db
    plan: free
    databaseName: dream_advisor
    user: dream_advisor

services:
  - type: web
    name: dream-advisor-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: dream-advisor-db
          property: connectionString

  - type: web
    name: dream-advisor-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: echo "placeholder static site -- replace with the real frontend build"
    staticPublishPath: ./public
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: dream-advisor-backend
          property: hostport
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
