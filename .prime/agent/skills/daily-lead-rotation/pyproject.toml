[project]
name = "prime-agent-skill-daily-lead-rotation"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "prime-agent-runtime",
  "superdb @ git+https://github.com/brimdata/superdb-python",
]

[project.scripts]
daily_lead_rotation = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daily_lead_rotation"]
